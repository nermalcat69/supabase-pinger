version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    ports:
      - '6929:6929'
    environment:
      SUPABASE_URL_1: ${SUPABASE_URL_1}
      SUPABASE_PUBLISHABLE_KEY_1: ${SUPABASE_PUBLISHABLE_KEY_1}
      SUPABASE_URL_2: ${SUPABASE_URL_2}
      SUPABASE_PUBLISHABLE_KEY_2: ${SUPABASE_PUBLISHABLE_KEY_2}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6929/health"]
      interval: 30s
      timeout: 10s
      retries: 3
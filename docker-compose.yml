services:
  app:
    build:
      context: .
      target: production
    ports:
      - '6929:6929'
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6929/health"]
      interval: 30s
      timeout: 10s
      retries: 3
